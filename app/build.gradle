plugins { id 'com.android.application' }
def releaseSigningAvailable = rootProject.file('signing/docubuds-release.p12').exists() && System.getenv('DOCUBUDS_SIGNING_PASSWORD')
android {
 namespace 'com.docubuds.app'
 compileSdk 36
 buildToolsVersion '35.0.0'
 defaultConfig { applicationId 'com.docubuds.app'; minSdk 30; targetSdk 36; versionCode 7; versionName '1.2.3' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { if (releaseSigningAvailable) { release { storeFile rootProject.file('signing/docubuds-release.p12'); storePassword System.getenv('DOCUBUDS_SIGNING_PASSWORD'); keyAlias 'docubuds'; keyPassword System.getenv('DOCUBUDS_SIGNING_PASSWORD') } } }
 buildTypes { release { if (releaseSigningAvailable) { signingConfig signingConfigs.release }; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro' } }
 testOptions { unitTests.returnDefaultValues=true }
 lint { abortOnError true; disable 'OldTargetApi','GradleDependency' }
}
dependencies {
 implementation 'androidx.camera:camera-camera2:1.5.3'
 implementation 'androidx.camera:camera-lifecycle:1.5.3'
 implementation 'androidx.camera:camera-view:1.5.3'

 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
 testImplementation 'junit:junit:4.13.2'
}
